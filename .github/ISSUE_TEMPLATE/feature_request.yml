name: Feature Request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe what you need and why.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow pain point this would address.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the CLI / API look like?
      placeholder: |
        pgit diff --since 7d   # show all changes in the last 7 days
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds exist today?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI command
        - Semantic diff
        - Eval / merge
        - Parser (new format)
        - Remote sync
        - TypeScript SDK
        - Other
    validations:
      required: true
