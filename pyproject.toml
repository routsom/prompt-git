[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-prompt-git"
version = "0.1.0"
description = "Git-style version control for LLM prompts — commit, diff, branch, merge, tag, and rollback with semantic diffs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "prompt-git contributors" },
]
keywords = ["git", "prompts", "llm", "version-control", "ai", "prompt-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/routsom/prompt-git"
Repository = "https://github.com/routsom/prompt-git"
Issues = "https://github.com/routsom/prompt-git/issues"

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
semantic = ["anthropic>=0.30"]
dev = ["pytest", "mypy", "ruff", "pytest-cov", "pytest-recording", "types-PyYAML"]

[project.scripts]
pgit = "pgit.cli.main:app_entry"

[tool.setuptools.packages.find]
include = ["pgit*"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
